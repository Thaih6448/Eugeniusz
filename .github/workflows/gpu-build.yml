name: Optional GPU compilation
on: workflow_dispatch
permissions:
  contents: read
jobs:
  vulkan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libvulkan-dev glslc
      - run: cmake -S . -B build/gpu -DCMAKE_BUILD_TYPE=Release -DEUGENIUSZ_LLAMA=ON -DEUGENIUSZ_ACCELERATOR=VULKAN
      - run: cmake --build build/gpu --parallel 3
      - run: ctest --test-dir build/gpu --output-on-failure
  metal:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build/gpu -DCMAKE_BUILD_TYPE=Release -DEUGENIUSZ_LLAMA=ON -DEUGENIUSZ_ACCELERATOR=METAL
      - run: cmake --build build/gpu --parallel 3
      - run: ctest --test-dir build/gpu --output-on-failure

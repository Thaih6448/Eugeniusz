name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
        llama: ['OFF', 'ON']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20 -DEUGENIUSZ_LLAMA=${{ matrix.llama }}
      - run: cmake --build build/ci --config Release --parallel 3
      - run: ctest --test-dir build/ci -C Release --output-on-failure
      - run: cmake --install build/ci --config Release --prefix build/install
      - name: Python ABI, quality corpus, archive and release tests
        env:
          PYTHONPATH: bindings/python
          EUGENIUSZ_LIBRARY_DIR: build/install
        run: python tests/run_tests.py
      - name: Benchmark validation with Python optimization enabled
        run: python -O -m unittest discover -s tests -p test_api_dataset.py -v
      - run: dotnet build examples/dotnet/Example.csproj -c Release
      - name: WinForms build and game rules tests
        if: runner.os == 'Windows'
        run: |
          dotnet build examples/winforms/Eugeniusz.WinForms.sln -c Release
          dotnet run --project examples/winforms/Tests -c Release --no-build
      - name: .NET ABI test
        shell: bash
        run: |
          export LD_LIBRARY_PATH="$PWD/build/install/lib:${LD_LIBRARY_PATH:-}"
          export DYLD_LIBRARY_PATH="$PWD/build/install/lib:${DYLD_LIBRARY_PATH:-}"
          dotnet examples/dotnet/bin/Release/net8.0/Example.dll
      - name: Installed CMake consumer
        run: cmake -S tests/consumer -B build/consumer -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/install -DEXPECT_LLAMA=${{ matrix.llama }}
      - run: cmake --build build/consumer --config Release
  static-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build/static -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/static --parallel 2
      - run: ctest --test-dir build/static --output-on-failure
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build/sanitizers -DCMAKE_BUILD_TYPE=Debug -DBUILD_SHARED_LIBS=OFF -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - run: cmake --build build/sanitizers --parallel 2
      - run: ctest --test-dir build/sanitizers --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

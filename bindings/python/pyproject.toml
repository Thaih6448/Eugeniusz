[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eugeniusz"
version = "0.1.0"
description = "Local typed probabilistic decisions through the Eugeniusz C ABI"
requires-python = ">=3.9"
license = {text = "MIT"}

[tool.setuptools]
packages = ["eugeniusz"]
